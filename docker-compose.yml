services:

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    environment:
      # Route litellm's OUTBOUND provider calls (synthetic.new, openrouter.ai, ...)
      # through llmtrim (HTTPS MITM on host) so fallbacks get tracked/compressed.
      # Local models (blastpc llama-swap) must bypass the proxy: NO_PROXY.
      HTTPS_PROXY: http://host.docker.internal:43117
      NO_PROXY: "localhost,127.0.0.1,blastpc,192.168.1.29,blastrpi,host.docker.internal,llama-gate,ollama-gate,ollama-gw"
      # ca-bundle.pem = system roots + llmtrim CA (kept in sync by llmtrim-ca-sync,
      # pubblicato in trust/ - vedi volume qui sotto: directory, non file)
      SSL_CERT_FILE: /data/.llmtrim/ca-bundle.pem
      # RAM ottimizzazione (RPi5 8GB):
      # - MALLOC_ARENA_MAX: glibc crea un'arena per thread e l'RSS di Python
      #   cresce per frammentazione; con 2 arene la crescita e' molto piu' lenta
      # - LITELLM_LOG WARNING: meno stringhe di log retenute/stampate
      MALLOC_ARENA_MAX: "2"
      LITELLM_LOG: WARNING
    # Hard-limit: se litellm supera questi confini viene OOM-killed LUI (e
    # riavviato) invece di spingere tutto l'host in OOM su zram (16GB azzerati).
    # Base osservata ~600MB (RSS+swap); 1G lascia ampio margine per streaming
    # lunghi e listing dinamico, memswap_limit = mem_limit -> nessun swap extra.
    mem_limit: 1g
    memswap_limit: 1g
    oom_score_adj: 200
    volumes:
      - ./config/config.yaml:/app/config.yaml
      - ./reasoning_clamp.py:/app/reasoning_clamp.py:ro
      # trust/ = SOLO ca-bundle.pem (pubblicato da llmtrim-ca-sync). Montare la
      # DIRECTORY e non il singolo file e' la fix della CA drift: il sync
      # sostituisce il bundle con `cat ... > bundle.tmp && mv` (NUOVO inode) e
      # un bind-mount di SINGOLO FILE resta pinned al vecchio inode per tutta
      # la vita del container -> CA ruotata = CERTIFICATE_VERIFY_FAILED
      # ("unable to get local issuer certificate") finche' il container non
      # viene ricreato. ca.key (0600) resta FUORI dal mount: non finisce nel
      # container.
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/.llmtrim:ro
    command:
      - "--config"
      - "/app/config.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - openrouter-gw
      - groq-gw
      - gemini-gw
      - inference4free-gw
      - ollama-gw
    restart: no
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',4000),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Gateway OpenRouter per litellm (vedi openrouter-gw/gw.py):
  # - riscrive /v1/* -> /api/v1/* (litellm si aspetta /v1 sull'host)
  # - /v1/models: prefixa gli id con "openrouter/" cosi' la wildcard
  #   openrouter/* di litellm li mostra tutti e li instrada 1:1 senza che la
  #   sua logica di rename corrompa gli id (openai/..., anthropic/...)
  # - l'upstream verso openrouter.ai esce ATTRAVERSO llmtrim (GW_PROXY), cosi'
  #   il traffico openrouter di litellm e' intercettato/tracciato/compresso
  #   come quello di AiderDesk diretto
  openrouter-gw:
    container_name: openrouter-gw
    image: python:3.13-slim
    command: ["sh", "-c", "pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./openrouter-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no

  # Gateway listing per Groq (vedi provider-gw/gw.py, stessa meccanica di
  # openrouter-gw): riscrive /v1/* -> /openai/v1/* (litellm chiama sempre
  # {origin}/v1 ignorando il path dell'api_base) e prefixa gli id di /models
  # con "groq/" cosi' la logica di rename di litellm non corrompe gli id
  # nativi (openai/gpt-oss-120b, ...).
  # Upstream verso api.groq.com ATTRAVERSO llmtrim (GW_PROXY).
  groq-gw:
    container_name: groq-gw
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
      UPSTREAM: https://api.groq.com
      PATH_PRE: /openai
      ID_PREFIX: groq/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no

  # Gateway listing per Gemini (provider-gw/gw.py): riscrive /v1/* ->
  # /v1beta/openai/* (l'endpoint OpenAI-compatible di Gemini vive li', ma
  # litellm chiama sempre {origin}/v1). Nessun ID_PREFIX: gli id nativi
  # "models/gemini-2.5-flash" non collidono con provider noti di litellm e
  # sono accettati cosi' come sono dall'endpoint. Upstream ATTRAVERSO llmtrim.
  gemini-gw:
    container_name: gemini-gw
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
      UPSTREAM: https://generativelanguage.googleapis.com
      PATH_PRE: /v1beta/openai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no

  # Gateway per inference4free (provider-gw/gw.py). ID_PREFIX=inference4free/
  # per il listing: il rename di litellm corromperebbe gli id nativi tipo
  # "deepseek/deepseek-chat" ("deepseek" e' un provider noto). Nessuna
  # riscrittura path (l'endpoint vive gia' su /v1). NOTA: l'upstream e'
  # plain-HTTP su LAN; llmtrim inoltra il traffico ma NON lo traccia (la sua
  # pipeline MITM/tracking e' solo-TLS, LLMTRIM_EXTRA_HOSTS estende i domini
  # HTTPS). L'hop resta per uniformita' architetturale e filtri futuri.
  inference4free-gw:
    container_name: inference4free-gw
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
      # hostname (non IP!): llmtrim riconosce SOLO host esatti in
      # LLMTRIM_EXTRA_HOSTS e scarta gli IP -> l'Host header del gateway
      # deve essere "deepseek4free" (nome del PROGETTO upstream, accoppiato
      # a LLMTRIM_EXTRA_HOSTS di llmtrim: non e' il nome del gateway)
      UPSTREAM: http://deepseek4free:18010
      ID_PREFIX: inference4free/
      # cache last-good del listing: l'endpoint e' instabile (progetto in
      # sviluppo); se /models fallisce, il gateway serve l'ultima lista
      # valida cosi' i modelli restano SEMPRE visibili su litellm
      MODELS_CACHE: "1"
      MODELS_CACHE_FILE: /cache/models.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "deepseek4free:192.168.1.13"
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - ./provider-gw/cache:/cache
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no

  # Gate TCP verso llama-swap (blastpc) - vedi llama-gate/gate.py:
  # PC spento -> 503 in ~2s (health-connect), PC acceso -> tubo trasparente
  # cosi' litellm puo' avere un timeout LUNGO (modelli enormi: 10-20 min)
  # senza restare appeso quando il PC e' spento.
  # GATE_TLS=1: llama-swap dal 2026-10-02 e' su https self-signed; la gate
  # termina il TLS verso l'upstream e serve HTTP in chiaro a litellm
  # (verifica cert disattivata: self-signed LAN, litellm non deve fidarsi).
  llama-gate:
    container_name: llama-gate
    image: python:3.13-slim
    command: ["python", "/app/gate.py"]
    environment:
      GATE_TLS: "1"
    extra_hosts:
      - "blastpc:192.168.1.29"
    volumes:
      - ./llama-gate/gate.py:/app/gate.py:ro
    restart: no

  # Stessa gate di llama-gate (stesso gate.py, env-driven) ma verso Ollama
  # (OpenAI-compatible su :11434, stessa macchina blastpc): PC spento ->
  # 503 in ~2s e litellm prosegue la catena di fallback; PC acceso ->
  # tubo trasparente con timeout lungo.
  ollama-gate:
    container_name: ollama-gate
    image: python:3.13-slim
    command: ["python", "/app/gate.py"]
    environment:
      GATE_UP_HOST: blastpc
      GATE_UP_PORT: "11434"
    extra_hosts:
      - "blastpc:192.168.1.29"
    volumes:
      - ./llama-gate/gate.py:/app/gate.py:ro
    restart: no

  # Gateway listing per Ollama (provider-gw/gw.py): nessuna riscrittura path
  # (l'endpoint OpenAI-compatible vive gia' su /v1, come deepseek4free).
  # ID_PREFIX=ollama/: litellm corromperebbe gli id nativi che iniziano con
  # nomi provider noti (es. "deepseek-r1:14b" -> "deepseek/..."); con il
  # prefisso la wildcard ollama/* li cattura e li instrada 1:1. Nessun
  # MODELS_CACHE su richiesta: i modelli devono apparire SOLO quando il PC
  # Windows e' online (listing dinamico reale).
  ollama-gw:
    container_name: ollama-gw
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      # upstream = ollama-gate (tubo TCP trasparente verso blastpc:11434)
      UPSTREAM: http://ollama-gate
      ID_PREFIX: ollama/
      # Ollama lista i modelli senza tag esplicito come "x:latest": strip
      # del suffisso -> nome pubblico "ollama/x" (il fallback di synthetic/*
      # in reasoning_clamp punta a "ollama/local-model", non ":latest")
      STRIP_LATEST: "1"
      # gw.py ha GW_CA obbligatoria (default /data/ca-bundle.pem): qui la
      # punta al bundle dentro il mount di directory (vedi sotto)
      GW_CA: /data/llmtrim/ca-bundle.pem
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      # gw.py setta SEMPRE verify=GW_CA: il bundle va montato anche se
      # l'upstream e' plain-HTTP (non usato, ma senza il file httpx crasha
      # all'avvio). Montaggio per DIRECTORY: un CA-rotation del bundle e'
      # visibile subito (un bind-mount di singolo file resta pinned al vecchio
      # inode finche' il container non e' ricreato).
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    depends_on:
      - ollama-gate
    restart: no
