services:

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    environment:
      # Route litellm's OUTBOUND provider calls (synthetic.new, openrouter.ai, ...)
      # through llmtrim (HTTPS MITM on host) so fallbacks get tracked/compressed.
      # Local models (blastpc llama-swap) must bypass the proxy: NO_PROXY.
      HTTPS_PROXY: http://host.docker.internal:43117
      NO_PROXY: "localhost,127.0.0.1,blastpc,192.168.1.29,blastrpi,host.docker.internal,llama-gate,ollama-gate,ollama-gw,gpt4free-gw"
      # ca-bundle.pem = system roots + llmtrim CA (kept in sync by llmtrim-ca-sync,
      # pubblicato in trust/ - vedi volume qui sotto: directory, non file)
      SSL_CERT_FILE: /data/.llmtrim/ca-bundle.pem
      # RAM ottimizzazione (RPi5 8GB):
      # - MALLOC_ARENA_MAX: glibc crea un'arena per thread e l'RSS di Python
      #   cresce per frammentazione; con 2 arene la crescita e' molto piu' lenta
      # - LITELLM_LOG WARNING: meno stringhe di log retenute/stampate
      MALLOC_ARENA_MAX: "2"
      LITELLM_LOG: WARNING
      # Postgres locale (servizio litellm-db qui sotto): spend logs, virtual
      # keys e UI funzionano SOLO con un DB. La password vive in .env
      # (gitignored): la sintassi ":?" fa fallire `docker compose up` se manca,
      # invece di avviare litellm con un DB irraggiungibile.
      # Le migrazioni prisma le applica il proxy da solo al primo avvio
      # (run_server(--skip_server_startup) + prisma generate): nessuno step
      # manuale. Il primo start e' piu' lento: aspettare il healthcheck.
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@litellm-db:5432/litellm
    # Tetto ALTO: litellm non deve essere OOM-killed (ogni kill tronca gli
    # stream in corso -> TransferEncodingError lato OpenWebUI), quindi 2g di
    # RAM + 1g di swap. Base osservata ~600MB; il vecchio 1g/1g moriva a
    # ~995MB e il 1.5g/2.5g + oom_score_adj 200 lo rendeva il primo candidato
    # all'OOM anche sull'host. oom_score_adj resta 0 (default).
    mem_limit: 2g
    memswap_limit: 3g
    volumes:
      - ./config/config.yaml:/app/config.yaml
      - ./reasoning_clamp.py:/app/reasoning_clamp.py:ro
      # trust/ = SOLO ca-bundle.pem (pubblicato da llmtrim-ca-sync). Montare la
      # DIRECTORY e non il singolo file e' la fix della CA drift: il sync
      # sostituisce il bundle con `cat ... > bundle.tmp && mv` (NUOVO inode) e
      # un bind-mount di SINGOLO FILE resta pinned al vecchio inode per tutta
      # la vita del container -> CA ruotata = CERTIFICATE_VERIFY_FAILED
      # ("unable to get local issuer certificate") finche' il container non
      # viene ricreato. ca.key (0600) resta FUORI dal mount: non finisce nel
      # container.
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/.llmtrim:ro
    command:
      - "--config"
      - "/app/config.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # litellm-db healthy (non solo started): il proxy apre il pool prisma
      # subito e senza DB pronto entrerebbe in un loop di errori di connessione.
      litellm-db:
        condition: service_healthy
      openrouter-gw:
        condition: service_started
      groq-gw:
        condition: service_started
      gemini-gw:
        condition: service_started
      gpt4free-gw:
        condition: service_started
      ollama-gw:
        condition: service_started
    restart: no
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',4000),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL per litellm - spend logs, virtual keys, /ui.
  # TUNING LIGHTWEIGHT (host RPi5 8GB, molta RAM gia' occupata): il default
  # di postgres (shared_buffers 128MB + work_mem 4MB x connessione) spinge
  # l'RSS oltre i 150MB; qui misurati ~20-35MB (shared_buffers 32MB compresi).
  # Ogni flag e' scelto
  # per quello, non per throughput:
  # - shared_buffers 32MB: cache condivisa, il resto lo fa la page cache
  # - max_connections 20: litellm apre al massimo un pool piccolo
  #   (database_connection_pool_limit in config.yaml) + healthcheck/migrazioni
  # - work_mem 1MB / maintenance_work_mem 16MB: sort/hash piccoli; i cleanup
  #   dei log sono a batch, non fanno sort enormi
  # - effective_cache_size 128MB: solo una stima per il planner (non alloca)
  # - jit=off: la compilazione JIT allocava decine di MB per query analitiche
  #   (cleanup/aggregati UI) per guadagni irrilevanti a questo volume
  # - max_wal_size 192MB / min_wal_size 48MB / checkpoint_timeout 15min:
  #   meno checkpoint (meno scritture su disco) senza WAL illimitato
  # - fsync/full_page_writes/synchronous_commit LASCIATI AI DEFAULT: sono la
  #   garanzia di non corrompere i dati su un host con swap pesante. Il
  #   guadagno di disattivarli non vale il rischio.
  # NESSUNA porta pubblicata: il DB e' raggiungibile solo dalla rete compose
  # (litellm-db:5432). Volume NAMED e non bind-mount: l'immagine alpine gira
  # come uid 70 e un bind-mount richiederebbe un chown manuale.
  # Retention: NON e' un cron esterno, la fa litellm stesso (general_settings:
  # maximum_spend_logs_retention_period + maximum_spend_logs_size).
  litellm-db:
    container_name: litellm-db
    image: postgres:17-alpine
    mem_limit: 192m
    # /dev/shm condiviso tra i worker: il default docker (64MB) basta per il
    # volume di questo DB, ma lo dichiariamo per non dipendere dal default.
    shm_size: 64m
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: litellm
      # PGDATA in sottocartella: il volume resta "inizializzato" solo se il
      # cluster c'e' davvero (evita il caso volume con lost+found).
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
      - -c
      - jit=off
      - -c
      - max_wal_size=192MB
      - -c
      - min_wal_size=48MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_messages=warning
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    restart: no
    healthcheck:
      # pg_isready e' il check nativo: risponde quando il server accetta
      # connessioni, non prima (le migrazioni prisma di litellm partono dopo).
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Gateway OpenRouter per litellm (vedi openrouter-gw/gw.py):
  # - riscrive /v1/* -> /api/v1/* (litellm si aspetta /v1 sull'host)
  # - /v1/models: prefixa gli id con "openrouter/" cosi' la wildcard
  #   openrouter/* di litellm li mostra tutti e li instrada 1:1 senza che la
  #   sua logica di rename corrompa gli id (openai/..., anthropic/...)
  # - l'upstream verso openrouter.ai esce ATTRAVERSO llmtrim (GW_PROXY), cosi'
  #   il traffico openrouter di litellm e' intercettato/tracciato/compresso
  #   come quello di AiderDesk diretto
  openrouter-gw:
    container_name: openrouter-gw
    mem_limit: 384m
    image: python:3.13-slim
    command: ["sh", "-c", "pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./openrouter-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no
    # Healthcheck a livello TCP: il gateway e' "vivo" quando il suo server
    # HTTP ascolta. NON si fa una richiesta HTTP sul listing perche'
    # dipenderebbe da proxy + upstream + auth (flapping: il provider puo'
    # essere down/senza chiavi mentre il gateway e' perfetto).
    # python:3.13-slim non ha curl, quindi socket in python (stessa
    # meccanica dell'healthcheck di litellm). start_period lungo: il
    # comando fa "pip install httpx" prima di avviare gw.py.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Gateway listing per Groq (vedi provider-gw/gw.py, stessa meccanica di
  # openrouter-gw): riscrive /v1/* -> /openai/v1/* (litellm chiama sempre
  # {origin}/v1 ignorando il path dell'api_base) e prefixa gli id di /models
  # con "groq/" cosi' la logica di rename di litellm non corrompe gli id
  # nativi (openai/gpt-oss-120b, ...).
  # Upstream verso api.groq.com ATTRAVERSO llmtrim (GW_PROXY).
  groq-gw:
    container_name: groq-gw
    mem_limit: 384m
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
      UPSTREAM: https://api.groq.com
      PATH_PRE: /openai
      ID_PREFIX: groq/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no
    # Healthcheck TCP (vedi openrouter-gw): il gateway vive di vita propria,
    # l'upstream groq.com no - un check HTTP sul listing dipenderebbe da
    # proxy + upstream + auth. start_period: "pip install httpx" prima di gw.py.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Gateway listing per Gemini (provider-gw/gw.py): riscrive /v1/* ->
  # /v1beta/openai/* (l'endpoint OpenAI-compatible di Gemini vive li', ma
  # litellm chiama sempre {origin}/v1). Nessun ID_PREFIX: gli id nativi
  # "models/gemini-2.5-flash" non collidono con provider noti di litellm e
  # sono accettati cosi' come sono dall'endpoint. Upstream ATTRAVERSO llmtrim.
  gemini-gw:
    container_name: gemini-gw
    mem_limit: 384m
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_PROXY: http://host.docker.internal:43117
      GW_CA: /data/llmtrim/ca-bundle.pem
      UPSTREAM: https://generativelanguage.googleapis.com
      PATH_PRE: /v1beta/openai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no
    # Healthcheck TCP (vedi openrouter-gw): il gateway vive di vita propria,
    # l'upstream generativelanguage no - un check HTTP sul listing dipenderebbe
    # da proxy + upstream + auth. start_period: "pip install httpx" prima di
    # gw.py.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Gateway per gpt4free (provider-gw/gw.py), che ha SOSTITUITO
  # inference4free-gw il 2026-11-02 (inference4free spento sul rpi5: il
  # blocco storico e' commentato qui sotto). Upstream = stack
  # /opt/docker/compose/gpt4free sullo STESSO host, porta host 1337
  # (G4F_PORT nel suo .env) -> 8080 nel container: dall'host si raggiunge
  # via LAN (192.168.1.13), come deepseek4free/blastpc.
  # ID_PREFIX=gpt4free/: il listing upstream e' dinamico e contiene id con
  # "/" (nvidia/nemotron-..., ovh-free/..., openrouter/free) e con ":free",
  # che il rename di litellm corromperebbe; col prefisso la wildcard
  # gpt4free/* li instrada 1:1 (il capture rimuove il prefisso). Nessuna
  # riscrittura path: l'endpoint vive gia' su /v1.
  # Il primo id del listing e' "auto": e' il router automatico di g4f
  # (Model("auto", base_provider=AnyProvider)) -> nome pubblico
  # "gpt4free/auto", lo stesso ruolo che aveva "inference4free/auto".
  # AUTH: l'API di g4f pretende la sua G4F_API_KEY (Authorization: Bearer,
  # oppure g4f-api-key) mentre litellm manda solo il segnaposto "dummy": il
  # gateway legge la chiave VERA da /gpt4free/.env (UPSTREAM_KEY_FILE +
  # UPSTREAM_KEY_NAME) e la SOSTITUISCE. Il .env e' gitignored e resta
  # fuori dal repo litellm. Il mount e' della DIRECTORY (non del singolo
  # file): un bind-mount di file resta pinned all'inode vecchio se
  # bootstrap.sh riscrive .env con mv, e un file assente verrebbe creato da
  # docker come DIRECTORY. La chiave e' riletta con TTL 60s: ruotarla non
  # richiede un restart del gateway.
  # NIENTE GW_PROXY: traffico LOCALE (stesso host), non passa da llmtrim -
  # che comunque non lo traccerebbe (la sua pipeline MITM e' solo-TLS).
  # GW_CA resta obbligatoria: gw.py setta SEMPRE verify=GW_CA (senza il file
  # httpx crasha all'avvio); montaggio per DIRECTORY per la CA-rotation.
  # MODELS_CACHE last-good: gpt4free e' in sviluppo e viene riavviato a
  # mano; se /models fallisce il gateway serve l'ultima lista valida e i
  # modelli restano SEMPRE visibili su litellm. File cache DIVERSO da
  # quello di inference4free (i due gateway condividono /cache).
  gpt4free-gw:
    container_name: gpt4free-gw
    mem_limit: 384m
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      GW_CA: /data/llmtrim/ca-bundle.pem
      UPSTREAM: http://gpt4free:1337
      ID_PREFIX: gpt4free/
      MODELS_CACHE: "1"
      MODELS_CACHE_FILE: /cache/gpt4free-models.json
      UPSTREAM_KEY_FILE: /gpt4free/.env
      UPSTREAM_KEY_NAME: G4F_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gpt4free:192.168.1.13"
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - ./provider-gw/cache:/cache
      - /opt/docker/compose/gpt4free:/gpt4free:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    restart: no
    # Healthcheck TCP (vedi openrouter-gw): il gateway vive di vita propria,
    # gpt4free e' un progetto in sviluppo riavviato a mano - un check HTTP
    # sul listing marcherebbe "unhealthy" un gateway che serve bene dalla
    # cache last-good. start_period: "pip install httpx" prima di gw.py.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # --- inference4free: DISATTIVATO il 2026-11-02 -------------------------
  # inference4free e' stato spento sul rpi5 e sostituito COMPLETAMENTE da
  # gpt4free (gpt4free-gw qui sopra + wildcard gpt4free/* in config.yaml).
  # Il blocco resta come riferimento per un ripristino: togliere il commento
  # qui e in config(.example).yaml e rimettere "inference4free-gw" in
  # depends_on di litellm.
  #
  # Gateway per inference4free (provider-gw/gw.py). ID_PREFIX=inference4free/
  # per il listing: il rename di litellm corromperebbe gli id nativi tipo
  # "deepseek/deepseek-chat" ("deepseek" e' un provider noto). Nessuna
  # riscrittura path (l'endpoint vive gia' su /v1). NOTA: l'upstream e'
  # plain-HTTP su LAN; llmtrim inoltra il traffico ma NON lo traccia (la sua
  # pipeline MITM/tracking e' solo-TLS, LLMTRIM_EXTRA_HOSTS estende i domini
  # HTTPS). L'hop resta per uniformita' architetturale e filtri futuri.
  # inference4free-gw:
  #   container_name: inference4free-gw
  #   mem_limit: 384m
  #   image: python:3.13-slim
  #   command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
  #   environment:
  #     GW_PROXY: http://host.docker.internal:43117
  #     GW_CA: /data/llmtrim/ca-bundle.pem
  #     # hostname (non IP!): llmtrim riconosce SOLO host esatti in
  #     # LLMTRIM_EXTRA_HOSTS e scarta gli IP -> l'Host header del gateway
  #     # deve essere "deepseek4free" (nome del PROGETTO upstream, accoppiato
  #     # a LLMTRIM_EXTRA_HOSTS di llmtrim: non e' il nome del gateway)
  #     UPSTREAM: http://deepseek4free:18010
  #     ID_PREFIX: inference4free/
  #     # cache last-good del listing: l'endpoint e' instabile (progetto in
  #     # sviluppo); se /models fallisce, il gateway serve l'ultima lista
  #     # valida cosi' i modelli restano SEMPRE visibili su litellm
  #     MODELS_CACHE: "1"
  #     MODELS_CACHE_FILE: /cache/models.json
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #     - "deepseek4free:192.168.1.13"
  #   volumes:
  #     - ./provider-gw/gw.py:/app/gw.py:ro
  #     - ./provider-gw/cache:/cache
  #     - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
  #   restart: no
  #   healthcheck:
  #     test:
  #       [
  #         "CMD",
  #         "python",
  #         "-c",
  #         "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
  #       ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s


  # Gate TCP verso llama-swap (blastpc) - vedi llama-gate/gate.py:
  # PC spento -> 503 in ~2s (health-connect), PC acceso -> tubo trasparente
  # cosi' litellm puo' avere un timeout LUNGO (modelli enormi: 10-20 min)
  # senza restare appeso quando il PC e' spento.
  # Eccezione LISTING: GET /v1/models a PC spento -> 200 con lista vuota.
  # Un 503 qui faceva loggare a litellm un WARNING per ogni wildcard a ogni
  # /v1/models dei client; GATE_OFFLINE_COOLDOWN (5s) evita di ripetere il
  # probe TCP (2s) per ogni wildcard dello stesso listing. L'inferenza
  # (chat/immagini/audio) resta 503 e prova SEMPRE la connessione.
  # GATE_TLS=auto: la gate PROVA il TLS e, se l'upstream risponde in HTTP
  # in chiaro (llama-swap senza ssl, dal 2026-10-02), riparte su TCP pulito:
  # funziona con https self-signed E con http senza toccare la config quando
  # lo schema upstream cambia. GATE_TLS=1 forza il TLS (503 se fallisce),
  # GATE_TLS=0 forza il chiaro. La gate serve a litellm SEMPRE HTTP.
  llama-gate:
    container_name: llama-gate
    mem_limit: 256m
    image: python:3.13-slim
    command: ["python", "/app/gate.py"]
    environment:
      GATE_TLS: "auto"
    extra_hosts:
      - "blastpc:192.168.1.29"
    volumes:
      - ./llama-gate/gate.py:/app/gate.py:ro
    restart: no
    # Healthcheck TCP sulla porta di ascolto della gate: misura LA GATE, non
    # il PC. Con il PC spento la gate e' sana per definizione (accetta e
    # risponde 503 in ~2s), quindi il check resta verde: marcare unhealthy
    # il PC spento sarebbe un falso allarme e, con --abort-on-container-exit,
    # un check che fa morire il container sarebbe un guasto inventato.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Stessa gate di llama-gate (stesso gate.py, env-driven) ma verso Ollama
  # (endpoint OpenAI-compatible su blastpc:11434, stessa macchina):
  # PC spento -> 503 in ~2s e litellm prosegue la catena di fallback;
  # PC acceso -> tubo trasparente con timeout lungo.
  ollama-gate:
    container_name: ollama-gate
    mem_limit: 256m
    image: python:3.13-slim
    command: ["python","/app/gate.py"]
    environment:
      GATE_UP_HOST: blastpc
      GATE_UP_PORT: "11434"
      # Ollama serve la sua API (OpenAI-compatible compresa) SEMPRE in HTTP
      # in chiaro sulla 11434: GATE_TLS=0 salta il tentativo di handshake TLS
      # (che fallirebbe) e la connessione TCP di fallback su OGNI richiesta.
      # Mettere "auto" (o "1") solo se in futuro Ollama parlasse TLS.
      GATE_TLS: "0"
    extra_hosts:
      - "blastpc:192.168.1.29"
    volumes:
      - ./llama-gate/gate.py:/app/gate.py:ro
    restart: no
    # Healthcheck TCP sulla porta di ascolto della gate (vedi llama-gate):
    # misura LA GATE, non il PC - col PC spento la gate e' sana per
    # definizione (503 in ~2s), quindi il check resta verde.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Gateway listing per Ollama locale (provider-gw/gw.py): nessuna riscrittura
  # path (l'endpoint OpenAI-compatible vive gia' su /v1, come deepseek4free).
  # ID_PREFIX=ollama/: la logica di listing di litellm corromperebbe gli id
  # nativi il cui primo segmento coincide con un provider noto (es.
  # "deepseek-r1:14b" -> "deepseek/..."); col prefisso la wildcard ollama/*
  # li cattura e li instrada 1:1 (il capture rimuove il prefisso). NIENTE
  # MODELS_CACHE: i modelli devono apparire SOLO quando il PC e' online
  # (listing dinamico reale; PC spento -> la gate risponde 200 con lista
  # vuota, cosi' litellm non logga un WARNING per ogni /v1/models).
  ollama-gw:
    container_name: ollama-gw
    mem_limit: 384m
    image: python:3.13-slim
    command: ["sh","-c","pip install --no-cache-dir httpx >/dev/null && python /app/gw.py"]
    environment:
      # upstream = ollama-gate (tubo TCP trasparente verso blastpc:11434);
      # nessun GW_PROXY: traffico LOCALE, non passa da llmtrim
      UPSTREAM: http://ollama-gate
      ID_PREFIX: ollama/
      # Ollama elenca i modelli senza tag esplicito come "x:latest": strip
      # del suffisso -> nome pubblico "ollama/x" (non "ollama/x:latest")
      STRIP_LATEST: "1"
      # Ollama NON espone context_length nel listing OpenAI-compatible: lo si
      # legge dall'endpoint nativo /api/tags e lo si inietta in /v1/models,
      # cosi' reasoning_clamp (_DYN_CTX) usa il contesto REALE per-modello
      # (stessa logica dinamica degli altri provider).
      CONTEXT_FROM: /api/tags
      # gw.py setta SEMPRE verify=GW_CA: il bundle va montato anche se
      # l'upstream e' plain-HTTP (non usato, ma senza il file httpx crasha
      # all'avvio). Montaggio per DIRECTORY: una CA-rotation e' visibile
      # subito (un bind-mount di singolo file resta pinned al vecchio inode).
      GW_CA: /data/llmtrim/ca-bundle.pem
    volumes:
      - ./provider-gw/gw.py:/app/gw.py:ro
      - /opt/docker/compose/llmtrim/data/.llmtrim/trust:/data/llmtrim:ro
    depends_on:
      - ollama-gate
    restart: no
    # Healthcheck TCP (vedi openrouter-gw): il gateway vive di vita propria,
    # l'upstream ollama no - un check HTTP sul listing dipenderebbe da
    # gate + PC. start_period: "pip install httpx" prima di gw.py.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',80),5); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  # Dati di litellm-db (spend logs, chiavi, utenti). Named volume: sopravvive
  # a `docker compose down` (muore solo con `down -v`).
  litellm_pgdata:
