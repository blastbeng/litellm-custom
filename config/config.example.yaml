# Esempio di configurazione litellm — copiare in config/config.yaml e
# sostituire TUTTI i placeholder con le proprie chiavi. NON COMMITTARE
# config/config.yaml (già in .gitignore: contiene chiavi reali).

model_list:

  # CONTESTI: i valori di max_input_tokens qui sotto DEVO NO stare allineati a
  # CONTEXT_BY_PREFIX in reasoning_clamp.py, che e' li' che avviene il CLAMP di
  # max_tokens (contesto - prompt). Il limite lo impone l'upstream: i modelli
  # grossi girano su Strata (dietro llama-swap) e contano col tokenizer reale,
  # rispondendo 400 "prompt (N) + max tokens (M) exceeds the context (C);
  # requests are never truncated" - il 400 uccide la catena di fallback intera.
  # Sul PC si puo' delegare l'adattamento A Strata stessa: "fit_max_tokens":
  # true in strata-<model>.json (o About -> Model settings nella sua web UI).
  # Contesto cambiato qui = cambiato li'.
  #
  # Se il PROMPT da solo satura il contesto (prompt + 1024 + margine > C) il
  # clamp non basta: parte la CASCATA in reasoning_clamp.py - B compattazione
  # con un modello da 262k disponibile, C compressione BM25
  # (litellm.compression.compress, lossy), E map/reduce su small-model, poi
  # 413 strutturato. I modelli con contesto >= 262144 sono anche i compattatori
  # di B: togliere tutti i 262k dalla config toglie il livello B alla cascata.

  # --- Modelli locali (PC 192.168.1.29, llama-swap: una richiesta alla volta) ---
  # local-model e' il modello principale; small-model e' un modello autonomo
  # invocabile direttamente e come fallback e' solo il PRIMO target di
  # synthetic/syn:small:text (reasoning_clamp).
  # Se tutti sono occupi/spenti restituiscono l'errore (comportamento voluto).
  - model_name: local-model
    litellm_params:
      model: openai/local-model
      # gate locale: se blastpc non risponde al TCP/TLS entro ~2s risponde 503
      # subito (PC spento), altrimenti fa da tubo trasparente - vedi
      # llama-gate/gate.py. GATE_TLS=auto: llama-swap rispondendo in http
      # (senza ssl, dal 2026-10-02) la gate fa tubo in chiaro, ma se tornasse
      # su https self-signed termina lei il TLS - qui resta SEMPRE HTTP in
      # chiaro comunque vada l'upstream. Serve perche'
      # litellm ha un SOLO timeout per
      # l'intera richiesta (httpx, connect incluso): senza gate, un timeout
      # lungo validerebbe anche il caso "PC spento" (appendersi per mezz'ora),
      # e un timeout corto troncherebbe i modelli enormi.
      api_base: http://llama-gate/v1
      api_key: dummy
      # NIENTE max_parallel_requests: in v1.104.0 lo slot non viene rilasciato
      # dopo la prima richiesta (bug upstream) e il modello morirebbe dopo il
      # primo uso. La serializzazione la fa gia' llama-swap (una richiesta
      # alla volta, in coda).
      # PC acceso: modelli enormi (caricamento + inferenza) possono impiegare
      # 10-20 minuti -> 30 min di tetto. PC spento: la gate 503 in ~2s.
      timeout: 1800
    model_info:
      id: local-qwen-backend
      # contesto ridotto lato llama-server (era 262144) per risparmiare
      # RAM/VRAM: litellm deve dichiararlo ai client
      max_input_tokens: 131072
      max_output_tokens: 32768
      max_tokens: 32768

  # --- Secondo modello locale (PC 192.168.1.29, llama-swap): modello autonomo,
  # invocabile direttamente; e' l'ULTIMO ricorso di fallback di TUTTI i
  # modelli (richiesta utente 2026-10-02, vedi reasoning_clamp) e l'UNICO
  # target di synthetic/syn:small:text e synthetic/syn:small:vision
  # (richiesta utente 2026-10-04: ALLINEATI). Non cade mai su se stesso.
  # Stessa gate di local-model.
  - model_name: small-model
    litellm_params:
      model: openai/small-model
      api_base: http://llama-gate/v1
      api_key: dummy
      timeout: 1800
    model_info:
      id: local-small-backend
      # assumo lo stesso contesto di local-model (131072): aggiornare se
      # small-model dichiara un contesto diverso su llama-swap
      max_input_tokens: 131072
      max_output_tokens: 32768
      max_tokens: 32768

  # --- Modello embedding locale (PC 192.168.1.29, llama-swap) ---
  # Invocabile direttamente; e' il FALLBACK di
  # synthetic/hf:nomic-ai/nomic-embed-text-v1.5 (richiesta utente 2026-10-04,
  # vedi reasoning_clamp): il modello embedding e' servito dall'endpoint
  # /v1/embeddings di synthetic.new (non compare nel listing chat) e quando
  # non disponibile la richiesta cade qui (llama-swap: Qwen3-Embedding-0.6b
  # su CPU, contesto 16384 dichiarato da llama-server). Stessa gate di
  # local-model/small-model: PC spento = 503 in ~2s.
  - model_name: embedding-model
    litellm_params:
      model: openai/embedding-model
      api_base: http://llama-gate/v1
      api_key: dummy
      timeout: 1800
    model_info:
      id: local-embedding-backend
      # contesto dichiarato da llama-swap per l'embedding model
      max_input_tokens: 16384


  # --- Modelli synthetic.new: importati in automatico ---
  # Wildcard unica "synthetic/*" per runtime + listing. Il capture rimuove
  # "synthetic/", quindi all'endpoint arrivano gli id nativi ("syn:large:text",
  # "hf:openai/gpt-oss-120b", ...). /v1/models espande la wildcard con la
  # lista REALE dell'endpoint (check_provider_endpoint).
  - model_name: synthetic/*
    litellm_params:
      model: openai/*
      api_base: https://api.synthetic.new/openai/v1
      api_key: syn_YOUR_SYNTHETIC_API_KEY
      # 32768 (era 131072): i litellm_params default vengono uniti da litellm
      # a OGNI tentativo, fallback inclusi, DOPO l'hook (che non li vede):
      # prompt + default deve stare nel contesto di OGNI target della catena
      # (local-model, small-model - tutti 131072)
      max_tokens: 32768
      # reasoning di default per OGNI richiesta su questa wildcard
      # (sovrascrivibile dal client): synthetic supporta
      # none/low/medium/high/xhigh/max
      reasoning_effort: xhigh
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 32768
      max_tokens: 131072

  # --- Modelli OpenRouter: importati in automatico ---
  # Nome pubblico "openrouter/<id-nativo>" (es. openrouter/z-ai/glm-5.3-prime).
  # Listing tramite openrouter-gw: riscrive /v1/* -> /api/v1/* (l'API
  # OpenRouter vive su /api/v1) e prefixa gli id con "openrouter/" per evitare
  # il rename di litellm su id tipo "openai/...", "anthropic/...".
  - model_name: openrouter/*
    litellm_params:
      model: openai/*
      api_base: http://openrouter-gw/v1
      api_key: sk-or-v1-YOUR_OPENROUTER_API_KEY
      # NIENTE max_tokens di default: verrebbe unito da litellm a OGNI
      # tentativo (fallback inclusi, dopo l'hook) e su small-model (131072,
      # ultimo ricorso di tutti) produrrebbe un 400; senza tetto ogni modello
      # OpenRouter usa il proprio output di default
      # reasoning di default per OGNI richiesta (OpenRouter accetta
      # reasoning_effort come alias del suo parametro unificato
      # reasoning.effort), sovrascrivibile dal client
      reasoning_effort: xhigh
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768
      max_tokens: 262144

  # --- Modelli Groq: importati in automatico ---
  # Listing via groq-gw (ID_PREFIX "groq/": il rename di litellm corromperebbe
  # gli id nativi "openai/gpt-oss-120b", "qwen/..."). NIENTE max_tokens di
  # default (tetto per-modello su Groq) e NIENTE reasoning_effort di default
  # (gestito dalla callback reasoning_clamp: default/clamp "high" solo sui
  # modelli reasoning, parametro rimosso sugli altri).
  - model_name: groq/*
    litellm_params:
      model: openai/*
      api_base: http://groq-gw/openai/v1
      api_key: gsk_YOUR_GROQ_API_KEY
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 65536
      max_tokens: 262144

  # --- Modelli Google Gemini: importati in automatico ---
  # Endpoint OpenAI-compatible (generativelanguage.googleapis.com/v1beta/
  # openai) via gemini-gw (PATH_PRE "/v1beta/openai": litellm chiama sempre
  # {origin}/v1). NIENTE max_tokens di default (come openrouter/*):
  # verrebbe unito a ogni tentativo di fallback e 400erebbe su small-model.
  # reasoning gestito dalla callback reasoning_clamp (default
  # "high"; "xhigh" non e' un valore valido su Gemini).
  - model_name: gemini/*
    litellm_params:
      model: openai/*
      api_base: http://gemini-gw/v1beta/openai
      api_key: YOUR_GEMINI_API_KEY
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 65536
      max_tokens: 262144

  # --- Modelli Ollama Cloud (ollama.com): importati in automatico ---
  # Nome pubblico "ollama-cloud/<model>": il prefisso "-cloud" marca che sono
  # i modelli di ollama.com (cloud), NON locali - l'Ollama locale e' stata
  # rimossa il 2026-10-04, il prefisso resta per chiarezza.
  - model_name: ollama-cloud/*
    litellm_params:
      model: openai/*
      api_base: https://ollama.com/v1
      api_key: YOUR_OLLAMA_API_KEY
      # NIENTE max_tokens di default (come openrouter/* e gemini/*): su
      # small-model (131072, ultimo ricorso di tutti) produrrebbe un 400
      # reasoning di default per OGNI richiesta (sovrascrivibile dal client);
      # i modelli senza reasoning lo ignorano
      reasoning_effort: xhigh
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768
      max_tokens: 262144

  # --- inference4free (upstream deepseek4free, 192.168.1.13:18010) -------
  # TUTTI i modelli, dinamici. Endpoint OpenAI-compatible senza auth
  # (progetto in sviluppo, instabile): via inference4free-gw con ID_PREFIX
  # "inference4free/" e cache last-good del
  # listing (MODELS_CACHE=1) -> i modelli restano visibili anche quando
  # l'endpoint e' giu'. NIENTE reasoning_effort di default (non validabile
  # per-modello).
  - model_name: inference4free/*
    litellm_params:
      model: openai/*
      api_base: http://inference4free-gw/v1
      api_key: dummy
      max_tokens: 32768
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 32768
      max_tokens: 32768

litellm_settings:
  # espansione delle wildcard in /model/info e /v1/models: usa la lista
  # modelli REALE dell'endpoint invece di quella statica
  check_provider_endpoint: true
  # Callback reasoning_clamp: cascata/clamp reasoning per provider
  # (xhigh->high->...) e policy fallback per-modello via
  # litellm_params.fallbacks per-request (vedi reasoning_clamp.py)
  callbacks: reasoning_clamp.rclamp
  # 50MB (default litellm 500MB): ogni body viene bufferizzato in RAM; su
  # host con poca RAM (es. RPi5) il limite basso evita picchi in OOM.
  max_request_size: 50
  num_retries: 0
  cache: false
  drop_params: false

  # Fallback (richiesta utente 2026-10-02): small-model e' l'ULTIMO ricorso
  # di TUTTI i modelli, raggiunto SOLO dopo che tutti gli altri fallback sono
  # miseramente falliti. Catene per-modello (via callback reasoning_clamp,
  # wildcard-safe):
  # (Ollama LOCALE rimossa il 2026-10-04: niente ollama/*, ollama-gate,
  #  ollama-gw - resta ollama-cloud/*, che e' ollama.com)
  # - synthetic/*  -> local-model -> small-model
  # - synthetic/syn:small:text e synthetic/syn:small:vision -> small-model
  #   (richiesta utente 2026-10-04: ALLINEATI, UN SOLO fallback,
  #   piccolo->piccolo. syn:small:VISION su small-model (text-only su
  #   llama-swap) puo' rispondere 400 sull'input vision: scelta esplicita)
  # - synthetic/hf:nomic-ai/nomic-embed-text-v1.5 -> embedding-model
  #   (embeddings: quando synthetic non e' disponibile la richiesta cade sul
  #   modello embedding di llama-swap; vedi reasoning_clamp)
  # - local-model -> small-model
  # - small-model -> NESSUN fallback (e' lui l'ultimo ricorso di tutti gli
  #   altri; riprovarlo da solo non avrebbe senso)
  # - embedding-model -> NESSUN fallback (unico modello embedding della
  #   catena: un target CHAT su una richiesta embedding risponderebbe 400)
  # - TUTTI gli altri (groq/*, gemini/*, openrouter/*, openrouter/free,
  #   ollama-cloud/*, inference4free/*) -> small-model direttamente
  # Le chiavi dei fallback in litellm NON supportano wildcard
  # (get_fallback_model_group: solo esatto / stripped-provider / "*"), quindi
  # la policy per-modello e' implementata nella callback reasoning_clamp via
  # litellm_params.fallbacks per-request, che OVERRIDE questa lista
  # (router.py: kwargs.get("fallbacks", self.fallbacks)). La catch-all
  # "*": ["small-model"] qui sotto e' la rete di sicurezza per qualunque
  # richiesta che non passi dalla callback.
  fallbacks:
    - "*": ["small-model"]

router_settings:
  # enable_pre_call_checks DISATTIVO: con le wildcard i nomi espansi non
  # esistono nel registry statico di litellm e i pre-call checks sollevano
  # ModelNotMappedError PRIMA della chiamata, deviando tutto silenziosamente
  # sul fallback catch-all.
  enable_pre_call_checks: false
  num_retries: 1
  retry_after: 1

general_settings:
  master_key: sk-YOUR_LITELLM_MASTER_KEY
  # Senza DB postgres gli spend log si accumulano in RAM per ogni richiesta:
  # disattivali se non usi spend/budget tracking.
  disable_spend_logs: true